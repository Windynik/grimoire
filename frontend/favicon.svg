<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1a1f2e" stroke="#a855f7" stroke-width="3"/>

  <!-- Inner glow -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.5"/>

  <!-- Stylized mana symbol / pentagram -->
  <g transform="translate(50, 50)">
    <!-- Five points for colors of magic -->
    <!-- White (top) -->
    <circle cx="0" cy="-28" r="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.5"/>

    <!-- Blue (top right) -->
    <circle cx="26.6" cy="-8.7" r="6" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>

    <!-- Black (bottom right) -->
    <circle cx="16.5" cy="23.5" r="6" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>

    <!-- Red (bottom left) -->
    <circle cx="-16.5" cy="23.5" r="6" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>

    <!-- Green (top left) -->
    <circle cx="-26.6" cy="-8.7" r="6" fill="#10b981" stroke="#059669" stroke-width="1.5"/>

    <!-- Connecting lines (pentagram) -->
    <path d="M 0,-28 L 16.5,23.5 M 16.5,23.5 L -26.6,-8.7 M -26.6,-8.7 L 26.6,-8.7 M 26.6,-8.7 L -16.5,23.5 M -16.5,23.5 L 0,-28"
          stroke="#a855f7"
          stroke-width="2"
          fill="none"
          opacity="0.6"/>

    <!-- Center sparkle -->
    <circle cx="0" cy="0" r="4" fill="#a855f7"/>
    <circle cx="0" cy="0" r="2" fill="#fbbf24"/>
  </g>

  <!-- Outer ring detail -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
</svg>
